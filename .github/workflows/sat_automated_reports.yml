name: Despacho Automatizado de Informes SAT-V (100% Cloud)

on:
  schedule:
    # 07:20 AM Colombia (UTC-5) = 12:20 UTC
    - cron: '20 12 * * *'
    # 07:30 AM Colombia (UTC-5) = 12:30 UTC
    - cron: '30 12 * * *'
  workflow_dispatch: # Permite ejecutar manualmente desde el panel de GitHub en cualquier momento

jobs:
  envio-informes-sat:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Clonar repositorio
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🚀 Ejecutar despacho automatizado de informes SAT
        env:
          PROJECT_NAME: "Sistema de Alertas Tempranas SAT-V Moodle 2026"
          VERSION: "1.0.0"
          API_PREFIX: "/api/v1/sat"
          SUPABASE_URL: "${{ secrets.SUPABASE_URL }}"
          SUPABASE_KEY: "${{ secrets.SUPABASE_KEY }}"
          SMTP_HOST: "${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}"
          SMTP_PORT: "${{ secrets.SMTP_PORT || '587' }}"
          SMTP_USER: "${{ secrets.SMTP_USER || 'pedro.noriega@gmail.com' }}"
          SMTP_PASSWORD: "${{ secrets.SMTP_PASSWORD }}"
          SMTP_FROM: "${{ secrets.SMTP_FROM || 'pedro.noriega@gmail.com' }}"
          MOODLE_URL: "https://campusvirtual.tecnologicadeloriente.edu.co"
          MOODLE_COURSE_ID: "956"
        run: |
          python send_sat_report.py
